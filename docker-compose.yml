services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmc
      POSTGRES_PASSWORD: gmc
      POSTGRES_DB: gmc
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
